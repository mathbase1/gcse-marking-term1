eCorrect cost\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e10 bread rolls\u003c/td\u003e\u003ctd\u003e£2.30\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2 birthday cakes\u003c/td\u003e\u003ctd\u003e£17.90\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e12 cupcakes\u003c/td\u003e\u003ctd\u003e£10.47\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003cth\u003eTotal\u003c/th\u003e\u003cth\u003e£30.67\u003c/th\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e","guidanceHtml":"\u003cp\u003eThere are \u003cstrong\u003ethree separate marks\u003c/strong\u003e. Bread rolls and birthday cakes earn \u003cstrong\u003eone mark together\u003c/strong\u003e, only when both are correct. The cupcakes earn one mark. The total earns one mark.\u003c/p\u003e\u003cp\u003eFor the bread rolls, \u003cstrong\u003e230p written outside the bill\u003c/strong\u003e is allowed. Writing 230 in the printed £ column is a place-value error.\u003c/p\u003e\u003cp\u003eA different total can earn its mark if it correctly adds your three original prices without mixing up pounds and pence. Ask your tutor if you are unsure whether your error was a place-value error.\u003c/p\u003e","schemePage":2,"groups":[{"id":"paired","label":"Bread rolls AND birthday cakes: one mark together.","max":1,"options":[{"id":"correct","label":"BOTH are correct: bread rolls £2.30 and birthday cakes £17.90.","detail":"£17.9 is fine. For bread rolls, 230p outside the bill is also allowed.","score":1},{"id":"other","label":"One or both of these two prices is wrong or missing.","detail":"One correct price on its own does not earn this paired mark.","score":0,"targetHint":"money calculations"}],"targets":[{"code":"MF6.08","reason":"Calculate each item cost, checking how many items are in a pack.","supporting":false}]},{"id":"cupcakes","label":"Cupcakes: one mark.","max":1,"options":[{"id":"correct","label":"My cupcake price is £10.47.","detail":"","score":1},{"id":"other","label":"My cupcake price is different or missing.","detail":"Twelve cupcakes means three packs of four.","score":0,"targetHint":"money calculations with packs"}],"targets":[{"code":"MF6.08","reason":"Calculate each item cost, checking how many items are in a pack.","supporting":false}]},{"id":"total","label":"Total: one mark, including allowed follow-through.","max":1,"options":[{"id":"correct","label":"My total is £30.67.","detail":"This earns the total mark even if I did not show addition.","score":1},{"id":"followthrough","label":"My different total correctly adds my three original prices, with pounds and pence kept in the correct place.","detail":"A wrong item price can be carried forward; a place-value error cannot.","score":1,"targetHint":"money calculations"},{"id":"other","label":"My total is wrong, missing, or includes a pounds/pence place-value error.","detail":"If it is not £30.67, check the addition of your own three prices before selecting this.","score":0,"targetHint":"adding money"}],"targets":[{"code":"MF6.03","reason":"Add money amounts with the decimal points lined up.","supporting":false}]}],"targets":[{"code":"MF6.08","reason":"Calculate each item cost, checking how many items are in a pack.","supporting":false},{"code":"MF6.03","reason":"Add money amounts with the decimal points lined up.","supporting":false}]},{"id":"q6bi","q":6,"ref":"6(b)(i)","page":5,"max":1,"promptHtml":"\u003cp\u003eCheck your explanation of why Philip bought another pack of cupcakes after his bill reached £37.\u003c/p\u003e","answerHtml":"\u003cp\u003eSpending another \u003cstrong\u003e£3.49\u003c/strong\u003e takes the bill above £40, so he receives a \u003cstrong\u003e£5 discount\u003c/strong\u003e. His shopping therefore costs \u003cstrong\u003e£1.51 less\u003c/strong\u003e than the original £37 bill.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eYour wording can differ. The scheme also accepts an explanation that spending at least another £3 earns a £5 saving. The explanation must connect the extra spending to the saving; simply saying “he bought more cupcakes” is not enough.\u003c/p\u003e","schemePage":2,"groups":[{"id":"answer","label":"What did your original explanation show?","max":1,"options":[{"id":"correct","label":"I explained that spending enough extra to reach £40 gives a £5 discount, or that the extra £3.49 makes the shopping £1.51 cheaper.","detail":"Equivalent wording is allowed. It must describe the benefit of the offer.","score":1},{"id":"other","label":"I did not explain the extra spending and saving, or left it blank.","detail":"If your explanation is different but you think it makes the same point, use tutor check.","score":0,"targetHint":"best-buy and discount reasoning"}]}],"targets":[{"code":"MF16.04","reason":"Explain why spending £3.49 extra to obtain a £5 discount saves £1.51 overall.","supporting":true}]},{"id":"q6bii","q":6,"ref":"6(b)(ii)","page":5,"max":1,"promptHtml":"\u003cp\u003eCheck how much Philip pays after buying the extra pack and using the discount.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cstrong\u003e£35.49\u003c/strong\u003e, from £37 + £3.49 − £5.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eThis is a one-mark answer. There is no separate method or follow-through mark in this part.\u003c/p\u003e","schemePage":2,"groups":[{"id":"answer","label":"Check your original amount paid.","max":1,"options":[{"id":"correct","label":"I gave £35.49.","detail":"","score":1},{"id":"other","label":"I gave a different amount, or left it blank.","detail":"","score":0,"targetHint":"money and discounts"}]}],"targets":[{"code":"MF6.05","reason":"Add the extra pack to the £37 bill before subtracting the £5 discount.","supporting":false}]},{"id":"q6c","q":6,"ref":"6(c)","page":5,"max":2,"promptHtml":"\u003cp\u003eCheck the cost of \u003cstrong\u003e8 birthday cakes\u003c/strong\u003e using the “4 for the price of 3” offer.\u003c/p\u003e","answerHtml":"\u003cp\u003ePay for \u003cstrong\u003e6 cakes\u003c/strong\u003e: \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e6\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e8.95\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e53.70\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e. The cost is \u003cstrong\u003e£53.70\u003c/strong\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eA correct method pays for six cakes, for example two groups of three. If there is no other credit, the scheme gives one special-case mark for \u003cstrong\u003e£71.60\u003c/strong\u003e, the correct price of all eight cakes without applying the offer.\u003c/p\u003e","schemePage":2,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":2,"options":[{"id":"full","label":"My final cost is £53.70.","detail":"£53.7 is the same amount.","score":2},{"id":"method","label":"I correctly charged for six cakes at £8.95 each, but my final cost was wrong or missing.","detail":"An equivalent calculation such as 2 × 3 × £8.95 counts.","score":1,"targetHint":"money calculations","targets":[{"code":"MF6.08","reason":"Check the decimal multiplication 6 × £8.95 after correctly applying the offer.","supporting":false}]},{"id":"special","label":"I gave £71.60, the cost of all eight cakes without the offer.","detail":"This earns one special-case mark if there is no other credit.","score":1,"targetHint":"best buys and special offers"},{"id":"other","label":"None of these matches my work, or I left it blank.","detail":"","score":0,"targetHint":"best buys and special offers"}]}],"targets":[{"code":"MF16.04","reason":"Apply the 4-for-the-price-of-3 offer: eight cakes means paying for six cakes.","supporting":true}]},{"id":"q7ab","q":7,"ref":"7(a) and 7(b)","page":6,"max":2,"promptHtml":"\u003cp\u003eThese two parts are checked together because the scheme has a shared special-case mark for consistently incorrect probability notation.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e7(a):\u003c/strong\u003e probability of ticket 20. \u003cstrong\u003e7(b):\u003c/strong\u003e probability of a ticket number greater than 200.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cstrong\u003e7(a):\u003c/strong\u003e \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmn\u003e500\u003c/mn\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.002\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.2\u003c/mn\u003e\u003cmo\u003e%\u003c/mo\u003e\u003c/mrow\u003e\u003c/math\u003e.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e7(b):\u003c/strong\u003e \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmn\u003e300\u003c/mn\u003e\u003cmn\u003e500\u003c/mn\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.6\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e60\u003c/mn\u003e\u003cmo\u003e%\u003c/mo\u003e\u003c/mrow\u003e\u003c/math\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eEquivalent fractions, decimals and percentages are allowed. The scheme says to \u003cstrong\u003eignore subsequent working\u003c/strong\u003e: a correct probability still counts if a later conversion went wrong.\u003c/p\u003e\u003cp\u003e“1 out of 500” and “300 out of 500” are not accepted as correct notation for the individual marks. If \u003cstrong\u003eboth\u003c/strong\u003e answers use these correct values in the same incorrect notation, and neither earns its normal mark, the pair earns \u003cstrong\u003eone shared mark out of two\u003c/strong\u003e. The app adds this once.\u003c/p\u003e","schemePage":2,"groups":[{"id":"a","label":"7(a): what did you originally write?","max":1,"options":[{"id":"correct","label":"I wrote 1/500, 0.002, 0.2%, or an equivalent probability in correct notation.","detail":"Count it even if a later conversion was wrong.","score":1},{"id":"words","label":"I only wrote “1 out of 500” (the right numbers in this incorrect notation).","detail":"This may qualify for the shared special-case mark with 7(b).","score":0,"targetHint":"probability notation","targets":[{"code":"MF46.03","reason":"Write the probability as a fraction, decimal or percentage instead of using “out of” notation.","supporting":false}]},{"id":"other","label":"I wrote a different answer, or left 7(a) blank.","detail":"For another unusual notation, use tutor check.","score":0,"targetHint":"simple probability"}],"ref":"7(a)"},{"id":"b","label":"7(b): what did you originally write?","max":1,"options":[{"id":"correct","label":"I wrote 300/500, 3/5, 0.6, 60%, or an equivalent probability in correct notation.","detail":"Count it even if a later conversion was wrong.","score":1},{"id":"words","label":"I only wrote “300 out of 500” (the right numbers in this incorrect notation).","detail":"Both parts must use the same incorrect notation for the shared mark.","score":0,"targetHint":"probability notation","targets":[{"code":"MF46.03","reason":"Write the probability as a fraction, decimal or percentage instead of using “out of” notation.","supporting":false}]},{"id":"other","label":"I wrote a different answer, or left 7(b) blank.","detail":"For another unusual notation, use tutor check.","score":0,"targetHint":"probability from a sample space"}],"ref":"7(b)"}],"special":"sharedProbability","targets":[{"code":"MF46.03","reason":"Divide the number of winning tickets by the total, using a fraction, decimal or percentage.","supporting":false}]},{"id":"q7c","q":7,"ref":"7(c)","page":6,"max":1,"promptHtml":"\u003cp\u003eBen owns 8 of the 500 tickets and claims his chance is 50% because he either wins or does not win. Check your decision \u003cstrong\u003eand\u003c/strong\u003e explanation.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cstrong\u003eNo\u003c/strong\u003e, with a correct explanation about Ben’s chance. His chance of winning is \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmfrac\u003e\u003cmn\u003e8\u003c/mn\u003e\u003cmn\u003e500\u003c/mn\u003e\u003c/mfrac\u003e\u003c/math\u003e, which is less than 50%. He would need 250 tickets for a 50% chance.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eAccepted explanations include “Ben winning and losing are not equally likely”, “he has an 8 in 500 chance”, “he needs more tickets for a 50% chance”, or “he has not bought 50% of the tickets”. Equivalent clear reasoning counts.\u003c/p\u003e\u003cp\u003eThe supplied scheme specifically rejects the bare statements “winning and losing are not equally likely” without linking them to Ben, and “he only has 8 out of 500 tickets” without explaining the chance. A “No” on its own earns no mark.\u003c/p\u003e","schemePage":2,"groups":[{"id":"answer","label":"Check your original decision and explanation together.","max":1,"options":[{"id":"correct","label":"I said No and explained Ben’s chance using one of the accepted ideas above.","detail":"Both the decision and the explanation are needed.","score":1},{"id":"other","label":"I did not give both No and a valid explanation, or left it blank.","detail":"Use tutor check if your wording is different and you are not sure.","score":0,"targetHint":"probability reasoning"}]}],"targets":[{"code":"MF46.03","reason":"Explain that Ben’s 8 winning tickets out of 500 give a chance below 50%; two possible outcome types do not make the chances equal.","supporting":true}]},{"id":"q7di","q":7,"ref":"7(d)(i)","page":6,"max":1,"promptHtml":"\u003cp\u003eZac’s chance of winning is 0.01. Check his chance of \u003cstrong\u003enot winning\u003c/strong\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e0.01\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e0.99\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e. Also accept 99% or an equivalent probability.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eA correct equivalent fraction, decimal or percentage earns the mark.\u003c/p\u003e","schemePage":2,"groups":[{"id":"answer","label":"Check your original probability.","max":1,"options":[{"id":"correct","label":"I gave 0.99, 99%, 99/100, or an equivalent probability.","detail":"","score":1},{"id":"other","label":"I gave a different answer, or left it blank.","detail":"","score":0,"targetHint":"complementary probability"}]}],"targets":[{"code":"MF46.04","reason":"Find the chance of not winning by subtracting the chance of winning from 1.","supporting":true}]},{"id":"q7dii","q":7,"ref":"7(d)(ii)","page":6,"max":2,"promptHtml":"\u003cp\u003eCheck how many of the 500 tickets Zac owns when his winning probability is 0.01.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e0.01\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e500\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e5\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e: \u003cstrong\u003e5 tickets\u003c/strong\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eA correct method includes 0.01 × 500, 500 − (0.99 × 500), or an equivalent probability proportion linking Zac’s tickets to 500. A probability fraction alone is not a final answer giving a number of tickets.\u003c/p\u003e","schemePage":2,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":2,"options":[{"id":"full","label":"My answer is 5 tickets.","detail":"A clear final answer of 5 is enough.","score":2},{"id":"method","label":"I showed a correct method or probability proportion, but did not give a correct final number of tickets.","detail":"For example: 0.01 × 500, 500 − (0.99 × 500), or 1/100 = 5/500 without a final ticket count.","score":1,"targetHint":"probability and expected frequency"},{"id":"other","label":"I did not show a valid method or answer, or left it blank.","detail":"","score":0,"targetHint":"probability and expected frequency"}]}],"targets":[{"code":"MF46.09","reason":"Multiply 0.01 by 500 to find the number of tickets represented by that probability.","supporting":true}]},{"id":"q8","q":8,"ref":"8","page":7,"max":2,"promptHtml":"\u003cp\u003eCheck the range and median of 7, 9, 6, 3, 7, 9, 6.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cstrong\u003eRange: 6.\u003c/strong\u003e \u003cstrong\u003eMedian: 7.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOrdered data: 3, 6, 6, 7, 7, 9, 9. The range is 9 − 3; the middle value is 7.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eThe two answers earn one mark each. Check the correct answer box: range and median are not interchangeable.\u003c/p\u003e","schemePage":2,"groups":[{"id":"range","label":"Range: one mark.","max":1,"options":[{"id":"correct","label":"I gave a range of 6.","detail":"","score":1},{"id":"other","label":"My range is wrong or missing.","detail":"","score":0,"targetHint":"range"}],"targets":[{"code":"MF49.07","reason":"Find the range by subtracting the smallest value from the largest.","supporting":false}]},{"id":"median","label":"Median: one mark.","max":1,"options":[{"id":"correct","label":"I gave a median of 7.","detail":"","score":1},{"id":"other","label":"My median is wrong or missing.","detail":"","score":0,"targetHint":"median"}],"targets":[{"code":"MF49.02","reason":"Order all the values and identify the middle value to find the median.","supporting":false}]}],"targets":[{"code":"MF49.07","reason":"Find the range by subtracting the smallest value from the largest.","supporting":false},{"code":"MF49.02","reason":"Order all the values and identify the middle value to find the median.","supporting":false}]},{"id":"q9a","q":9,"ref":"9(a)","page":7,"max":2,"promptHtml":"\u003cp\u003eThe scale is \u003cstrong\u003e1 cm on the model represents ¼ metre in real life\u003c/strong\u003e. The model is 30 cm tall. Check the actual height.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e30\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e0.25\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e7.5\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e: \u003cstrong\u003e7.5 m\u003c/strong\u003e, or \u003cstrong\u003e750 cm\u003c/strong\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eMark your \u003cstrong\u003efinal answer\u003c/strong\u003e. If you wrote units, they must match the value. A valid method could use 30 × 0.25, 30 × ¼, 30 × 25 to work in centimetres, or use 4 model centimetres for each real metre.\u003c/p\u003e\u003cp\u003eIf no other credit applies, a decimal/place-value error using the digits 75 earns one special-case mark. This means forms such as 75, 0.75 or 7500; it does not mean any number that happens to contain a 7 and a 5.\u003c/p\u003e","schemePage":2,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":2,"options":[{"id":"full","label":"My final answer is 7.5 m, 750 cm, or an exactly equivalent correct length.","detail":"Units are optional here, but any units written must be correct.","score":2},{"id":"method","label":"I used a correct scale method, but my final value or units were wrong or missing.","detail":"For example, 30 × 0.25, 30 × 25, or an equivalent scale calculation.","score":1,"targetHint":"scale drawings"},{"id":"digits75","label":"I showed no valid method, but my final answer has the digits 75 with only a decimal/place-value error.","detail":"This is one special-case mark. Use tutor check if you are unsure.","score":1,"targetHint":"place value and unit conversions"},{"id":"other","label":"None of these matches my work, or I left it blank.","detail":"","score":0,"targetHint":"scale drawings"}]}],"targets":[{"code":"MF39.01","reason":"Use the model scale in the correct direction and label the actual length with the correct unit.","supporting":false}]},{"id":"q9b","q":9,"ref":"9(b)","page":7,"max":2,"promptHtml":"\u003cp\u003eThe real front window is \u003cstrong\u003e2 metres\u003c/strong\u003e wide. Check its width on the model, using the same scale. The question asks for \u003cstrong\u003ecentimetres\u003c/strong\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003cmo\u003e÷\u003c/mo\u003e\u003cmn\u003e0.25\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e8\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e: \u003cstrong\u003e8 cm\u003c/strong\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eA valid method includes 2 ÷ 0.25, 2 ÷ ¼, 200 ÷ 25, or doubling “4 cm on the model represents 1 m”. The scheme also allows 2 ÷ 25 for the method mark.\u003c/p\u003e\u003cp\u003eIf you used your own mistaken scale consistently, only the method mark can carry forward. An unsupported answer of \u003cstrong\u003e0.08 m\u003c/strong\u003e earns one special-case mark; the required final answer was in cm.\u003c/p\u003e","schemePage":3,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":2,"options":[{"id":"full","label":"My final answer is 8 cm (or 8 with no extra incorrect unit).","detail":"A different written unit must not contradict centimetres.","score":2},{"id":"method","label":"I showed a correct division/scale method, but my final answer in cm was wrong or missing.","detail":"Includes 2 ÷ 0.25, 200 ÷ 25, 2 ÷ 25, or an equivalent method.","score":1,"targetHint":"scale drawings"},{"id":"followthrough","label":"I consistently used my own mistaken scale to find the model width.","detail":"For example, if my own scale was 1 cm for 0.5 m, I used 2 ÷ 0.5. Ask the tutor if the follow-through is unclear.","score":1,"targetHint":"scale factors"},{"id":"metres","label":"I gave 0.08 m without supporting working.","detail":"One special-case mark: the question specifically requested cm.","score":1,"targetHint":"converting length units"},{"id":"other","label":"None of these matches my work, or I left it blank.","detail":"","score":0,"targetHint":"scale drawings"}]}],"targets":[{"code":"MF39.01","reason":"Reverse the scale to find the model width, then give the answer in centimetres.","supporting":false}]},{"id":"q10a","q":10,"ref":"10(a)","page":8,"max":3,"promptHtml":"\u003cp\u003eCheck your answers for the three marked angles \u003cstrong\u003ea, b and c\u003c/strong\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmi\u003ea\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e43\u003c/mn\u003e\u003cmo\u003e°\u003c/mo\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmspace width=\"0.6em\"/\u003e\u003cmi\u003eb\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e62\u003c/mn\u003e\u003cmo\u003e°\u003c/mo\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmspace width=\"0.6em\"/\u003e\u003cmi\u003ec\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e76\u003c/mn\u003e\u003cmo\u003e°\u003c/mo\u003e\u003c/mrow\u003e\u003c/math\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eEach correct angle earns one mark. For a, subtract 47° from 90°. For b, use vertically opposite angles. For c, subtract 62° and 42° from 180°. There are no separate working marks or stated follow-through marks for wrong angle answers here.\u003c/p\u003e","schemePage":3,"groups":[{"id":"a","label":"Angle a: one mark.","max":1,"options":[{"id":"correct","label":"I gave a = 43°.","detail":"","score":1},{"id":"other","label":"My angle a is wrong or missing.","detail":"","score":0,"targetHint":"angles on a straight line and right angles"}],"targets":[{"code":"MF27.02","reason":"Use the right angle and the straight line to find angle a.","supporting":false}]},{"id":"b","label":"Angle b: one mark.","max":1,"options":[{"id":"correct","label":"I gave b = 62°.","detail":"","score":1},{"id":"other","label":"My angle b is wrong or missing.","detail":"","score":0,"targetHint":"vertically opposite angles"}],"targets":[{"code":"MF27.07","reason":"Use equal vertically opposite angles to find angle b.","supporting":false}]},{"id":"c","label":"Angle c: one mark.","max":1,"options":[{"id":"correct","label":"I gave c = 76°.","detail":"","score":1},{"id":"other","label":"My angle c is wrong or missing.","detail":"","score":0,"targetHint":"angles in triangles"}],"targets":[{"code":"MF28.01","reason":"Subtract the two known angles from 180° to find angle c.","supporting":false}]}],"targets":[{"code":"MF27.02","reason":"Use the right angle and the straight line to find angle a.","supporting":false},{"code":"MF27.07","reason":"Use equal vertically opposite angles to find angle b.","supporting":false},{"code":"MF28.01","reason":"Subtract the two known angles from 180° to find angle c.","supporting":false}]},{"id":"q10b","q":10,"ref":"10(b)","page":8,"max":1,"promptHtml":"\u003cp\u003eCheck the triangle name for interior angles \u003cstrong\u003e65°, 65° and 50°\u003c/strong\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cstrong\u003eIsosceles\u003c/strong\u003e: two of the angles are equal.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eYour selected mathematical name must be clear.\u003c/p\u003e","schemePage":3,"groups":[{"id":"answer","label":"Which triangle name did you originally choose?","max":1,"options":[{"id":"correct","label":"I chose Isosceles.","detail":"","score":1},{"id":"other","label":"I chose a different answer, or left it blank.","detail":"","score":0,"targetHint":"types of triangle"}]}],"targets":[{"code":"MF26.08","reason":"Recognise an isosceles triangle from two equal angles.","supporting":false}]},{"id":"q10c","q":10,"ref":"10(c)","page":9,"max":1,"promptHtml":"\u003cp\u003eCheck your measurement of the \u003cstrong\u003ereflex\u003c/strong\u003e angle ABC.\u003c/p\u003e","answerHtml":"\u003cp\u003eThe expected measurement is \u003cstrong\u003e300°\u003c/strong\u003e. The scheme accepts \u003cstrong\u003e298° to 302° inclusive\u003c/strong\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eA reflex angle is greater than 180°. The smaller angle of about 60° does not answer this question. This one-mark part awards the mark for a measurement within the stated tolerance.\u003c/p\u003e","schemePage":3,"groups":[{"id":"answer","label":"Check the reflex angle you originally wrote.","max":1,"options":[{"id":"correct","label":"My measurement is between 298° and 302°, including either endpoint.","detail":"Decimal values within the interval are allowed.","score":1},{"id":"other","label":"My measurement is outside that interval, I gave the smaller angle, or I left it blank.","detail":"","score":0,"targetHint":"measuring reflex angles"}]}],"targets":[{"code":"MF26.13","reason":"Measure the smaller angle correctly, then subtract it from 360° to find the reflex angle.","supporting":false}]},{"id":"q11","q":11,"ref":"11","page":9,"max":3,"promptHtml":"\u003cp\u003eBike hire costs \u003cstrong\u003e£14 + £5.75 for each whole day\u003c/strong\u003e. Tom has £80. Check the greatest number of whole days he can afford.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmo\u003e(\u003c/mo\u003e\u003cmn\u003e80\u003c/mn\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e14\u003c/mn\u003e\u003cmo\u003e)\u003c/mo\u003e\u003cmo\u003e÷\u003c/mo\u003e\u003cmn\u003e5.75\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e11.478\u003c/mn\u003e\u003cmo\u003e…\u003c/mo\u003e\u003c/mrow\u003e\u003c/math\u003e. He can afford \u003cstrong\u003e11 whole days\u003c/strong\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eA complete subtract-then-divide method earns two method marks, even if the final whole-number decision is wrong. An answer of 11.4… or 11.5 implies those two method marks.\u003c/p\u003e\u003cp\u003eA correct trial of £14 + £5.75 × 11 = £77.25 also earns two method marks. To earn the final mark, 11 days must be indicated as the answer. Only subtracting £14 from £80, or another correct trial using more than one day, earns one method mark.\u003c/p\u003e","schemePage":3,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":3,"options":[{"id":"full","label":"I clearly gave 11 whole days as my final answer.","detail":"The correct final answer is enough unless other working contradicts it.","score":3},{"id":"completeMethod","label":"I subtracted £14 from £80 and divided the result by £5.75, but did not give 11 whole days correctly.","detail":"For example, (80 − 14) ÷ 5.75, with an arithmetic or final-answer error.","score":2,"targetHint":"formulae in context","targets":[{"code":"MF21.02","reason":"Check the calculation and give the greatest affordable whole number of days, then verify its cost.","supporting":false}]},{"id":"decimal","label":"I gave 11.4… or 11.5 days, without the correct whole-day answer.","detail":"The decimal answer implies the two method marks.","score":2,"targetHint":"interpreting whole-number solutions","targets":[{"code":"MF21.02","reason":"Choose 11 whole days, then check the cost is within £80. Do not leave a decimal number of days.","supporting":true}]},{"id":"trial11","label":"I showed £14 + £5.75 × 11 = £77.25, but did not identify 11 days as my answer.","detail":"The correct 11-day trial implies the two method marks.","score":2,"targetHint":"interpreting whole-number solutions","targets":[{"code":"MF21.02","reason":"Choose 11 whole days, then check the cost is within £80. Do not leave a decimal number of days.","supporting":true}]},{"id":"partial","label":"I only showed 80 − 14, or another correct cost trial using more than 1 day.","detail":"For example, 14 + 5.75 × 12 = 83. Use the higher option for the correct 11-day trial.","score":1,"targetHint":"formulae in context","targets":[{"code":"MF19.06","reason":"After subtracting the £14 fixed charge, divide the remaining budget by £5.75 per day.","supporting":false}]},{"id":"other","label":"None of these matches my work, or I left it blank.","detail":"","score":0,"targetHint":"formulae in context"}]}],"targets":[{"code":"MF21.02","reason":"Use the hire-cost formula to check the greatest whole number of days that stays within £80.","supporting":false}]},{"id":"q12","q":12,"ref":"12","page":10,"max":3,"promptHtml":"\u003cp\u003eA wheel makes \u003cstrong\u003e42 complete turns per minute\u003c/strong\u003e. Check how many degrees it turns in \u003cstrong\u003eone second\u003c/strong\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmn\u003e42\u003c/mn\u003e\u003cmn\u003e60\u003c/mn\u003e\u003c/mfrac\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e360\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e252\u003c/mn\u003e\u003cmo\u003e°\u003c/mo\u003e\u003c/mrow\u003e\u003c/math\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eA full method changes minutes to seconds and complete turns to degrees: (42 ÷ 60) × 360, (42 × 360) ÷ 60, or 42 × 6. This earns two method marks if the final answer is wrong.\u003c/p\u003e\u003cp\u003eOne appropriate step, such as 42 ÷ 60 = 0.7 turns per second or 42 × 360 = 15,120 degrees per minute, earns one method mark.\u003c/p\u003e","schemePage":4,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":3,"options":[{"id":"full","label":"My final answer is 252° in one second.","detail":"","score":3},{"id":"completeMethod","label":"I correctly set up both conversions, but my final answer was wrong or missing.","detail":"For example, (42 ÷ 60) × 360, (42 × 360) ÷ 60, or 42 × 6.","score":2,"targetHint":"direct proportion and unit rates"},{"id":"partial","label":"I made one correct conversion step, but did not complete both.","detail":"I used 42/60, 0.7 turns per second, or 42 × 360 degrees per minute appropriately.","score":1,"targetHint":"direct proportion and unit rates"},{"id":"other","label":"I did not show a valid method or answer, or left it blank.","detail":"","score":0,"targetHint":"direct proportion and unit rates"}]}],"targets":[{"code":"MF16.05","reason":"Use 360° for one full turn and 60 seconds for one minute to find degrees per second.","supporting":false}]},{"id":"q13a","q":13,"ref":"13(a)","page":10,"max":2,"promptHtml":"\u003cp\u003eCheck your simplification of \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e5\u003c/mn\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e6\u003c/mn\u003e\u003cmi\u003eg\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e9\u003c/mn\u003e\u003cmi\u003eg\u003c/mi\u003e\u003c/mrow\u003e\u003c/math\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e8\u003c/mn\u003e\u003cmi\u003ef\u003c/mi\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmi\u003eg\u003c/mi\u003e\u003c/mrow\u003e\u003c/math\u003e. An equivalent order such as −3g + 8f is correct.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eCheck the \u003cstrong\u003efinal answer\u003c/strong\u003e. Two marks require both collected terms with the correct signs. One correct collected term, 8f or −3g, can earn one mark.\u003c/p\u003e\u003cp\u003eIf you wrote a correct expression earlier but then replaced it with a contradictory final expression, use tutor check: the abbreviated scheme says both “sight of” and “mark final answer”.\u003c/p\u003e","schemePage":4,"groups":[{"id":"route","label":"Choose the matching description of your original final expression.","max":2,"options":[{"id":"full","label":"My final expression is 8f − 3g, or an equivalent correctly simplified expression.","detail":"","score":2},{"id":"partial","label":"My final expression retains 8f or −3g correctly, but the complete expression is wrong or unfinished.","detail":"The minus sign belongs to the g term. 8f + 3g has only the f term correct.","score":1,"targetHint":"collecting like terms"},{"id":"other","label":"Neither collected term is correct in my final expression, or I left it blank.","detail":"Use tutor check for a correct earlier expression followed by a contradictory final one.","score":0,"targetHint":"collecting like terms"}]}],"targets":[{"code":"MF17.04","reason":"Collect the f terms and g terms separately, keeping the minus sign on the g term.","supporting":false}]},{"id":"q13b","q":13,"ref":"13(b)","page":10,"max":2,"promptHtml":"\u003cp\u003eCheck the value of \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e6\u003c/mn\u003e\u003cmi\u003ex\u003c/mi\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmi\u003ey\u003c/mi\u003e\u003c/mrow\u003e\u003c/math\u003e when x = 5.2 and y = 0.4.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e6\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e5.2\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e3\u003c/mn\u003e\u003cmo\u003e×\u003c/mo\u003e\u003cmn\u003e0.4\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e31.2\u003c/mn\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmn\u003e1.2\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e32.4\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eThe final answer for both marks is the \u003cstrong\u003enumber 32.4\u003c/strong\u003e. Eligible partial evidence is 31.2, 1.2, or the correct substitution 6 × 5.2 + 3 × 0.4.\u003c/p\u003e\u003cp\u003eThe scheme does not credit the incorrect forms 31.2x, 1.2y, 32.4xy, x = 31.2 or y = 1.2 by themselves. If you had correct numerical work and then contradicted it with a later algebraic expression, use tutor check.\u003c/p\u003e","schemePage":4,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":2,"options":[{"id":"full","label":"My final numerical answer is 32.4.","detail":"","score":2},{"id":"partial","label":"I did not reach the correct final answer, but showed 31.2, 1.2, or 6 × 5.2 + 3 × 0.4 correctly.","detail":"The credited evidence must use numbers correctly, not the rejected variable-tagged forms above.","score":1,"targetHint":"substitution"},{"id":"other","label":"I did not show any of the credited numerical evidence, or left it blank.","detail":"","score":0,"targetHint":"substitution"}]}],"targets":[{"code":"MF17.16","reason":"Replace each letter with its decimal value, multiply each term, then add the numerical results.","supporting":false}]},{"id":"q13c","q":13,"ref":"13(c)","page":10,"max":2,"promptHtml":"\u003cp\u003eCheck your solution of \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/mfrac\u003e\u003cmo\u003e−\u003c/mo\u003e\u003cmn\u003e4\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e6\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmfrac\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e10\u003c/mn\u003e\u003cmo\u003e,\u003c/mo\u003e\u003cmspace width=\"0.6em\"/\u003e\u003cmi\u003ee\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e20\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e. Alternatively, multiply the original equation by 2 to get e − 8 = 12, then solve.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eOne mark is available for the correct first step, and one for solving. The scheme also allows the second mark when a student correctly solves their own earlier mistaken equation of the form e/2 = k, e − m = 12, or e − 8 = n.\u003c/p\u003e\u003cp\u003eA correct answer embedded in a check, such as 20/2 − 4 = 6, can earn both marks. If that correct embedded value is then contradicted by a final e value other than 20, award only one mark.\u003c/p\u003e\u003cp\u003eThe stated special case e/2 = 6 + 4 followed by e = 6 + 4 × 2 (= 14) earns one mark in total. It never adds an extra mark to an already credited step.\u003c/p\u003e","schemePage":4,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":2,"options":[{"id":"full","label":"My final solution is e = 20.","detail":"A clear final answer of 20 is enough, provided it is not contradicted elsewhere.","score":2},{"id":"embedded","label":"I correctly used 20 in the original equation, with no later contradictory e value.","detail":"For example, 20/2 − 4 = 6, even without a separate e = 20 statement.","score":2},{"id":"contradicted","label":"I used 20 correctly in an embedded check, but then gave a different final value for e.","detail":"The scheme explicitly caps this case at one mark.","score":1,"targetHint":"solving equations"},{"id":"firstStep","label":"I reached e/2 = 10 or e − 8 = 12, but did not solve it correctly.","detail":"The first correct equation earns the mark.","score":1,"targetHint":"solving two-step equations"},{"id":"followthrough","label":"After an earlier error, I correctly solved my own equation in one of the allowed forms.","detail":"Examples: e/2 = 9 then e = 18; e − 6 = 12 then e = 18; e − 8 = 10 then e = 18. Use tutor check if your form differs.","score":1,"targetHint":"inverse operations"},{"id":"special","label":"I wrote e/2 = 6 + 4, then e = 6 + 4 × 2 (= 14).","detail":"This is one mark total, not an additional bonus.","score":1,"targetHint":"order of operations and equations"},{"id":"other","label":"None of these describes valid credited work, or I left it blank.","detail":"","score":0,"targetHint":"solving two-step equations"}]}],"targets":[{"code":"MF19.08","reason":"Undo the subtraction and division in the correct order, then check the solution in the original equation.","supporting":false}]},{"id":"q14a","q":14,"ref":"14(a)","page":11,"max":2,"promptHtml":"\u003cp\u003eCheck the ingredient amounts for \u003cstrong\u003e72 flapjacks\u003c/strong\u003e, using the recipe for 12. The scale factor is 6.\u003c/p\u003e","answerHtml":"\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eIngredient\u003c/th\u003e\u003cth\u003eFor 72 flapjacks\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003ePorridge oats\u003c/td\u003e\u003ctd\u003e1440 g\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eButter\u003c/td\u003e\u003ctd\u003e750 g\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBrown sugar\u003c/td\u003e\u003ctd\u003e600 g\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGolden syrup\u003c/td\u003e\u003ctd\u003e12 tablespoons\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e","guidanceHtml":"\u003cp\u003e\u003cstrong\u003eAll four\u003c/strong\u003e correct quantities earn two marks. \u003cstrong\u003eTwo or three\u003c/strong\u003e correct quantities earn one mark. Zero or one correct quantity earns no marks. Match each value to the correct ingredient and the printed unit.\u003c/p\u003e","schemePage":4,"groups":[{"id":"route","label":"How many original entries are correct?","max":2,"options":[{"id":"four","label":"All 4 values are correct.","detail":"","score":2},{"id":"twoThree","label":"Exactly 2 or 3 values are correct.","detail":"","score":1,"targetHint":"scaling recipes"},{"id":"zeroOne","label":"0 or 1 value is correct, or I left the table blank.","detail":"","score":0,"targetHint":"scaling recipes"}]}],"targets":[{"code":"MF16.02","reason":"Scale every ingredient by the same factor: 72 ÷ 12 = 6.","supporting":false}]},{"id":"q14b","q":14,"ref":"14(b)","page":11,"max":3,"promptHtml":"\u003cp\u003eAnatoly has \u003cstrong\u003e1.75 kg of butter\u003c/strong\u003e. Each batch of 12 flapjacks needs \u003cstrong\u003e125 g\u003c/strong\u003e. Check the greatest number of \u003cstrong\u003ebatches\u003c/strong\u003e.\u003c/p\u003e","answerHtml":"\u003cp\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e1.75\u003c/mn\u003e\u003cmtext\u003e kg\u003c/mtext\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e1750\u003c/mn\u003e\u003cmtext\u003e g\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e, then \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003cmrow\u003e\u003cmn\u003e1750\u003c/mn\u003e\u003cmo\u003e÷\u003c/mo\u003e\u003cmn\u003e125\u003c/mn\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmn\u003e14\u003c/mn\u003e\u003c/mrow\u003e\u003c/math\u003e: \u003cstrong\u003e14 batches of 12 flapjacks\u003c/strong\u003e.\u003c/p\u003e","guidanceHtml":"\u003cp\u003eThere is one mark for a correct unit conversion, one for dividing the available butter by the butter per batch, and one for the correct final batch count.\u003c/p\u003e\u003cp\u003eThe conversion can be shown directly (1.75 kg = 1750 g or 125 g = 0.125 kg) or implied by using 1750 ÷ 125 or 1.75 ÷ 0.125. The scheme allows one method mark for a division such as 1.75 ÷ 125 even when the units have not been converted correctly.\u003c/p\u003e\u003cp\u003eThe question asks for \u003cstrong\u003ebatches\u003c/strong\u003e. “168 flapjacks” alone is not the required final batch count. If 14 batches was clearly given as well, use the full-credit option.\u003c/p\u003e","schemePage":4,"groups":[{"id":"route","label":"Choose the highest matching description of your original work.","max":3,"options":[{"id":"full","label":"My final answer is 14 batches of 12 flapjacks.","detail":"A clear 14 batches implies the conversion and division unless written working contradicts it. Use tutor check for a coincidentally correct answer from invalid working.","score":3},{"id":"conversionAndMethod","label":"I converted the units correctly and used division for the batch count, but the final batch answer was wrong or missing.","detail":"For example, 1750 ÷ 125 or 1.75 ÷ 0.125, followed by an error or only a total number of flapjacks.","score":2,"targetHint":"interpreting answers in context","targets":[{"code":"MF16.03","reason":"Complete the division accurately and state 14 batches, rather than only the total number of flapjacks.","supporting":true}]},{"id":"conversionOnly","label":"I showed a correct conversion, but no creditable division to find the number of batches.","detail":"1.75 kg = 1750 g, or 125 g = 0.125 kg.","score":1,"targetHint":"ratio and proportional reasoning","targets":[{"code":"MF16.03","reason":"After converting to the same unit, divide available butter by 125 g per batch.","supporting":true}]},{"id":"methodWrongUnits","label":"I divided the available butter by 125 (or an incorrectly converted amount), but did not convert the units correctly.","detail":"For example, 1.75 ÷ 125 or 17.5 ÷ 125 earns the method mark only.","score":1,"targetHint":"converting mass units","targets":[{"code":"MF36.07","reason":"Convert 1.75 kg to 1750 g before dividing by 125 g. Repeat your division with these consistent units to obtain 14 batches.","supporting":false}]},{"id":"other","label":"I did not show any of these credited steps or an answer, or left it blank.","detail":"","score":0,"targetHint":"ratio with unit conversions"}]}],"targets":[{"code":"MF36.07","reason":"Convert kilograms and grams to the same mass unit before dividing.","supporting":false},{"code":"MF16.03","reason":"Divide the butter available by the butter for one batch, and state the number of complete batches.","supporting":true}]}]}</script>
<script>(function (global) {
  'use strict';

  function createEngine(data) {
    const steps = data.steps;
    const stepById = Object.fromEntries(steps.map(s => [s.id, s]));
    const totalMax = steps.reduce((n, s) => n + s.max, 0);
    const REVIEW = '__review__';
    const textLimit = (v, n) => typeof v === 'string' ? v.slice(0, n).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '') : '';

    function freshState(settings) {
      return {
        schema: 1, assessmentId: data.assessmentId, started: false,
        sessionId: 'session-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9),
        student: {name: '', tutor: '', group: '', number: ''},
        answers: {}, current: 0, view: 'welcome',
        settings: Object.assign({theme: 'light', large: false}, settings || {}),
        finalChecks: {front: false, targets: false, sent: false},
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
    }

    function validateState(raw) {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw) || raw.schema !== 1 || raw.assessmentId !== data.assessmentId) {
        throw new Error('This is not a progress file for this October 2026 assessment.');
      }
      const st = freshState();
      st.sessionId = textLimit(raw.sessionId, 100) || st.sessionId;
      st.started = raw.started === true;
      ['name', 'tutor', 'group', 'number'].forEach(k => st.student[k] = textLimit(raw.student && raw.student[k], 100).replace(/[\r\n]+/g, ' ').trim());
      if (st.started && !st.student.name) throw new Error('The saved student name is missing.');
      st.current = Number.isInteger(raw.current) ? Math.max(0, Math.min(steps.length - 1, raw.current)) : 0;
      st.view = ['welcome', 'mark', 'summary'].includes(raw.view) ? raw.view : 'welcome';
      if (raw.settings && ['light', 'dark', 'blue', 'yellow'].includes(raw.settings.theme)) st.settings.theme = raw.settings.theme;
      st.settings.large = !!(raw.settings && raw.settings.large === true);
      if (typeof raw.createdAt === 'string' && !Number.isNaN(Date.parse(raw.createdAt))) st.createdAt = raw.createdAt;
      if (typeof raw.updatedAt === 'string' && !Number.isNaN(Date.parse(raw.updatedAt))) st.updatedAt = raw.updatedAt;
      if (raw.answers && typeof raw.answers === 'object' && !Array.isArray(raw.answers)) {
        for (const s of steps) {
          const a = raw.answers[s.id];
          if (!a || typeof a !== 'object' || Array.isArray(a)) continue;
          const out = {choices: {}, paperDone: a.paperDone === true};
          for (const g of s.groups) {
            const val = a.choices && a.choices[g.id];
            if (val === undefined) continue;
            if (val !== REVIEW && !g.options.some(o => o.id === val)) throw new Error('The saved choice for Question ' + s.ref + ' is not recognised.');
            out.choices[g.id] = val;
          }
          if (a.override != null) {
            if (!Number.isInteger(a.override.score) || a.override.score < 0 || a.override.score > s.max || typeof a.override.reason !== 'string' || a.override.reason.trim().length < 3) {
              throw new Error('The tutor mark for Question ' + s.ref + ' is invalid.');
            }
            out.override = {score: a.override.score, reason: textLimit(a.override.reason, 600).trim()};
          }
          if (!scoreStep(s, out).decided) out.paperDone = false;
          st.answers[s.id] = out;
        }
      }
      for (const k of ['front', 'targets', 'sent']) st.finalChecks[k] = !!(raw.finalChecks && raw.finalChecks[k] === true);
      if (!summary(st).ready) {
        st.finalChecks = {front: false, targets: false, sent: false};
        if (st.view === 'summary') st.view = 'mark';
      }
      return st;
    }

    function scoreStep(sOrId, response) {
      const s = typeof sOrId === 'string' ? stepById[sOrId] : sOrId;
      if (!s) throw new Error('Unknown question.');
      const a = response || {};
      const groups = s.groups.map(g => {
        const selected = a.choices && a.choices[g.id];
        const option = g.options.find(o => o.id === selected);
        const review = selected === REVIEW;
        return {id: g.id, max: g.max, selected, option, score: option ? option.score : 0, missing: !option && !review, review};
      });
      if (a.override && Number.isInteger(a.override.score) && a.override.score >= 0 && a.override.score <= s.max && typeof a.override.reason === 'string' && a.override.reason.trim().length >= 3) {
        return {id: s.id, max: s.max, score: a.override.score, upper: a.override.score, groups, missing: false, review: false, decided: true, confirmed: true, shared: false, override: true, paperDone: a.paperDone === true};
      }
      const shared = s.special === 'sharedProbability' && groups.length === 2 && groups.every(g => g.selected === 'words');
      const score = shared ? 1 : groups.reduce((n, g) => n + g.score, 0);
      const missing = groups.some(g => g.missing);
      const review = groups.some(g => g.review);
      const upper = shared ? 1 : groups.reduce((n, g) => n + ((g.missing || g.review) ? g.max : g.score), 0);
      return {id: s.id, max: s.max, score, upper, groups, missing, review, decided: !missing, confirmed: !missing && !review, shared, override: false, paperDone: a.paperDone === true};
    }

    function summary(st) {
      const results = steps.map(s => scoreStep(s, st.answers[s.id]));
      const missing = results.filter(r => r.missing);
      const review = results.filter(r => r.review);
      const notWritten = results.filter(r => r.decided && !r.paperDone);
      const score = results.reduce((n, r) => n + r.score, 0);
      const upper = results.reduce((n, r) => n + r.upper, 0);
      const parents = Array.from({length: 14}, (_, i) => {
        const rs = results.filter(r => stepById[r.id].q === i + 1);
        return {q: i + 1, score: rs.reduce((n, r) => n + r.score, 0), upper: rs.reduce((n, r) => n + r.upper, 0), max: rs.reduce((n, r) => n + r.max, 0), pending: rs.some(r => !r.confirmed)};
      });
      return {results, score, upper, max: totalMax, missing, review, notWritten, parents,
        decided: results.filter(r => r.decided).length,
        recorded: results.filter(r => r.decided && r.paperDone).length,
        confirmed: results.every(r => r.confirmed),
        ready: !!st.started && !missing.length && !notWritten.length};
    }

    function targets(st) {
      const candidates = [];
      for (let index = 0; index < steps.length; index++) {
        const s = steps[index], a = st.answers[s.id] || {}, r = scoreStep(s, a);
        if (!r.confirmed || r.score === s.max) continue;
        const add = (items, ref, awarded, outOf, groupName) => {
          for (const t of items || []) {
            if (!data.nuggets[t.code]) throw new Error('Unknown Century nugget ' + t.code);
            candidates.push({code: t.code, reason: t.reason, supporting: t.supporting === true,
              ref, score: awarded, max: outOf, priority: awarded === 0 ? 1 : 2,
              index, lost: outOf - awarded, group: groupName || ''});
          }
        };
        if (r.override) {
          add(s.targets, s.ref, r.score, s.max, 'Tutor-adjusted mark');
          continue;
        }
        if (s.special === 'sharedProbability') {
          if (r.shared) {
            add([{code: 'MF46.03', reason: 'Write probabilities as fractions, decimals or percentages. Replace “out of” notation with 1/500 and 300/500.', supporting: false}], '7(a–b)', 1, 2, 'Shared notation mark');
          } else {
            for (const gr of r.groups) if (gr.score < gr.max) {
              const g = s.groups.find(x => x.id === gr.id);
              add(gr.option.targets || g.targets || s.targets, g.ref || s.ref, gr.score, gr.max, g.label);
            }
          }
          continue;
        }
        for (const gr of r.groups) if (gr.score < gr.max) {
          const g = s.groups.find(x => x.id === gr.id);
          add(gr.option.targets || g.targets || s.targets, s.ref, r.score, s.max, g.label);
        }
      }
      const grouped = new Map();
      for (const c of candidates) {
        if (!grouped.has(c.code)) grouped.set(c.code, {code: c.code, name: data.nuggets[c.code], priority: c.priority, refs: [], reasons: [], supporting: c.supporting, index: c.index, associatedLost: 0});
        const g = grouped.get(c.code);
        g.priority = Math.min(g.priority, c.priority);
        g.index = Math.min(g.index, c.index);
        g.supporting = g.supporting || c.supporting;
        if (!g.refs.some(x => x.ref === c.ref)) {
          g.refs.push({ref: c.ref, score: c.score, max: c.max, priority: c.priority});
          g.associatedLost += c.lost;
        }
        if (c.reason && !g.reasons.includes(c.reason)) g.reasons.push(c.reason);
      }
      return [...grouped.values()].sort((a, b) => a.priority - b.priority || b.associatedLost - a.associatedLost || a.index - b.index || a.code.localeCompare(b.code));
    }

    function grade(score) {
      const b = data.bands.find(band => score >= band.min);
      return b ? b.label : 'U';
    }

    function scoreText(r) { return r.score === r.upper ? r.score + '/' + r.max : r.score + '–' + r.upper + '/' + r.max; }

    function makeReport(st) {
      const sum = summary(st), list = targets(st);
      const lines = [data.reportTitle, '', 'Name: ' + (st.student.name || 'Not entered')];
      if (st.student.number) lines.push('Student number: ' + st.student.number);
      if (st.student.group) lines.push('Class / group: ' + st.student.group);
      if (st.student.tutor) lines.push('Tutor: ' + st.student.tutor);
      lines.push('');
      if (sum.confirmed) {
        lines.push('Self-assessed total: ' + sum.score + '/' + sum.max + ' (' + Math.round(sum.score / sum.max * 100) + '%).');
        lines.push('Assessment band: ' + grade(sum.score) + ' — using the grade table supplied with this paper.');
      } else {
        lines.push('PROVISIONAL self-assessed total: ' + scoreText(sum) + '.');
        lines.push('Confirmed credit so far: ' + sum.score + ' marks. Tutor checks or unmarked parts still need resolving.');
      }
      lines.push('', 'QUESTION TOTALS');
      lines.push(sum.parents.map(q => 'Q' + q.q + ': ' + scoreText(q) + (q.pending ? ' (pending)' : '')).join(' | '));
      lines.push('', 'PART-BY-PART MARKS');
      for (const s of steps) {
        const a = st.answers[s.id] || {}, r = scoreStep(s, a);
        if (s.special === 'sharedProbability' && r.confirmed && !r.shared && !r.override) {
          for (const gr of r.groups) {
            const g = s.groups.find(x => x.id === gr.id);
            lines.push('Q' + (g.ref || s.ref) + ': ' + gr.score + '/' + gr.max);
          }
        } else {
          lines.push('Q' + s.ref + ': ' + scoreText(r) + (r.shared ? ' (one shared notation mark across 7a and 7b)' : '') + (r.review ? ' — TUTOR CHECK' : r.missing ? ' — NOT YET MARKED' : '') + (r.override ? ' — tutor-adjusted' : ''));
        }
      }
      for (const priority of [1, 2]) {
        lines.push('', priority === 1 ? 'PRIORITY 1 — QUESTIONS / PARTS WITH ZERO MARKS' : 'PRIORITY 2 — QUESTIONS / PARTS WITH SOME MARKS LOST');
        const items = list.filter(t => t.priority === priority);
        if (!items.length) lines.push(priority === 1 ? 'No confirmed zero-mark targets.' : 'No additional partial-mark targets.');
        items.forEach((t, i) => {
          lines.push((i + 1) + '. ' + t.code + ' — ' + t.name);
          lines.push('   From: ' + t.refs.map(r => 'Q' + r.ref + ' (' + r.score + '/' + r.max + ')').join(', '));
          t.reasons.forEach(reason => lines.push('   Practise: ' + reason));
          if (t.supporting) lines.push('   This is the closest supporting nugget in the supplied list; also practise the specific question skill above.');
        });
      }
      if (!list.length && sum.confirmed && sum.score === sum.max) lines.push('', 'All marks achieved. No catch-up nuggets are needed from this assessment. Ask my tutor for an extension task.');
      if (list.length) {
        lines.push('', 'MY FIRST TWO TARGETS');
        list.slice(0, 2).forEach((t, i) => lines.push('Target ' + (i + 1) + ': ' + t.code + ' — ' + t.name));
        lines.push('', 'NEXT STEPS');
        lines.push('Complete the Century nuggets in the order above, starting with Priority 1. Search the exact MF code in my usual school Century account.');
        lines.push('Then return to the linked paper questions, write a corrected solution in a different colour, and show my tutor. Keep my original assessment score.');
        lines.push('If a listed code is unavailable, ask my tutor to locate or assign it.');
      }
      const reviewRows = sum.results.filter(r => r.review || r.missing);
      if (reviewRows.length) {
        lines.push('', 'QUESTIONS FOR MY TUTOR TO CHECK');
        for (const r of reviewRows) {
          const s = stepById[r.id];
          const labels = r.groups.filter(g => g.review || g.missing).map(g => s.groups.find(x => x.id === g.id).label);
          lines.push('Q' + s.ref + ': ' + labels.join('; ') + '.');
        }
        lines.push('Please resolve these marks with me. The total and targets will update afterwards.');
      }
      const overrides = steps.filter(s => st.answers[s.id] && st.answers[s.id].override);
      if (overrides.length) {
        lines.push('', 'TUTOR MARK ADJUSTMENTS');
        overrides.forEach(s => lines.push('Q' + s.ref + ': ' + st.answers[s.id].override.score + '/' + s.max + ' — ' + st.answers[s.id].override.reason));
      }
      lines.push('', 'PAPER CHECKLIST');
      lines.push('Question totals and ' + (sum.confirmed ? 'final' : 'provisional') + ' total written on the front: ' + (st.finalChecks.front ? 'Yes' : 'Still to do') + '.');
      lines.push('First targets copied onto my paper: ' + (st.finalChecks.targets ? 'Yes' : list.length ? 'Still to do' : 'Not needed — no targets') + '.');
      lines.push('', 'This is my self-assessment of my original exam work. Marks marked for tutor review are provisional.');
      return lines.join('\n');
    }

    return {data, steps, stepById, totalMax, REVIEW, freshState, validateState, scoreStep, summary, targets, grade, scoreText, makeReport};
  }

  global.AssessmentCore = {createEngine};
  if (typeof module !== 'undefined' && module.exports) module.exports = {createEngine};
  if (typeof document === 'undefined') return;

  const data = JSON.parse(document.getElementById('assessment-data').textContent);
  const engine = createEngine(data);
  const {steps, stepById, REVIEW} = engine;
  const STORAGE_KEY = 'gcse_assessment_october_2026_self_mark_v1';
  let state = engine.freshState();
  let storedAvailable = false, saveError = '', damagedSave = null, conflict = false, lastSeenRaw;
  let modalReturnFocus = null, currentModal = '', toastTimer;
  const byId = id => document.getElementById(id);
  const escapeHTML = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const e = escapeHTML;
  const markWord = n => n === 1 ? 'mark' : 'marks';
  const selectedResponse = s => state.answers[s.id] || {choices: {}, paperDone: false};

  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      lastSeenRaw = raw;
      if (raw) {
        try { state = engine.validateState(JSON.parse(raw)); storedAvailable = state.started; }
        catch (err) { damagedSave = raw; saveError = 'The saved progress could not be opened. Keep a copy before starting again. ' + err.message; }
      }
      if (!damagedSave) {
        const key = STORAGE_KEY + '_test';
        localStorage.setItem(key, '1'); localStorage.removeItem(key);
      }
    } catch (_) { saveError = 'This browser is not saving your work. Keep this tab open and download a progress backup from “Save / resume”.'; }
  }

  function save(replaceExisting) {
    state.updatedAt = new Date().toISOString();
    if ((damagedSave || conflict) && !replaceExisting) { updateSaveStatus(); return false; }
    try {
      const currentRaw = localStorage.getItem(STORAGE_KEY);
      if (!replaceExisting && currentRaw !== (lastSeenRaw === undefined ? null : lastSeenRaw)) {
        conflict = true; updateSaveStatus(); return false;
      }
      const nextRaw = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, nextRaw);
      lastSeenRaw = nextRaw;
      saveError = ''; storedAvailable = state.started;
    } catch (_) { saveError = 'Your latest changes are only in this open tab. Download a progress backup from “Save / resume” before closing.'; }
    updateSaveStatus();
    return !saveError;
  }

  function updateSaveStatus() {
    const bad = !!saveError || conflict;
    byId('save-state').classList.toggle('error', bad);
    byId('save-label').textContent = conflict ? 'Another tab changed the save' : bad ? 'Backup needed' : state.started ? 'Saved in this browser' : 'Browser saving ready';
    const warning = byId('storage-warning');
    warning.classList.toggle('hidden', !bad);
    warning.innerHTML = conflict ? 'Saved progress changed in another tab. <button type="button" class="inline-link" data-action="reload-save">Load the latest saved progress</button> before continuing, or download this tab’s backup first.' : e(saveError);
  }

  function invalidateCompletion() { state.finalChecks = {front: false, targets: false, sent: false}; }
  function applyDisplay() { document.body.dataset.theme = state.settings.theme; document.body.dataset.large = String(state.settings.large); }
  function focusMain() { byId('main').focus({preventScroll: true}); window.scrollTo({top: 0, behavior: 'instant'}); }
  function notify(message) {
    clearTimeout(toastTimer);
    byId('toast-root').innerHTML = '<div class="toast" role="status">' + e(message) + '</div>';
    toastTimer = setTimeout(() => { byId('toast-root').innerHTML = ''; }, 6000);
  }

  function render(focus) {
    applyDisplay();
    byId('overview-button').hidden = !state.started;
    if (!state.started || state.view === 'welcome') renderWelcome();
    else if (state.view === 'summary' && engine.summary(state).ready) renderSummary();
    else renderQuestion();
    byId('print-text').textContent = state.started && engine.summary(state).ready ? engine.makeReport(state) : 'Complete the marking steps before printing your results.';
    updateSaveStatus();
    if (focus) focusMain();
  }

  function markingExamples() {
    return '<div class="paper-title">On your exam paper</div><div class="paper-line"></div>' +
      '<div class="paper-demo"><span>All 3 marks</span><span class="mark-circle">[3]</span></div>' +
      '<div class="paper-demo"><span>1 mark out of 3</span><span><span class="mark-cross">[3]</span><span class="mark-written">1/3</span></span></div>' +
      '<div class="paper-demo"><span>No marks</span><span><span class="mark-cross">[3]</span><span class="mark-written">0/3</span></span></div>' +
      '<div class="paper-line"></div><p class="small-text muted">Mark the printed bracket at the end of the question.<br>Keep your original answer visible.</p>';
  }

  function renderWelcome() {
    const sum = engine.summary(state);
    let html = '';
    if (storedAvailable && state.started) {
      html += '<section class="card resume-box"><div><h2>Welcome back, ' + e(state.student.name) + '.</h2><p>' + sum.recorded + ' of ' + steps.length + ' marking steps recorded. Your choices are saved on this browser.</p></div><div class="buttons"><button type="button" class="primary" data-action="resume">' + (sum.ready ? 'Open my results' : 'Resume marking') + '</button><button type="button" class="subtle" data-action="reset">Different student / start again</button></div></section>';
    }
    html += '<section class="card hero"><div class="hero-copy"><div class="eyebrow">End term assessment · October 2026</div><h1>Mark your paper.<br>Choose your next steps.</h1><p class="muted">You have already completed the exam on paper. Now compare your original answers, record your marks and get your Century practice targets.</p><div class="pills"><span class="pill">50 marks</span><span class="pill">14 questions</span><span class="pill">One part at a time</span></div></div><div class="hero-visual">' + markingExamples() + '</div></section>';
    html += '<section class="card"><h2>Here is what you need to do</h2><div class="three-steps"><div class="mini-step"><span class="step-num">1</span><h3>Compare your work</h3><p>Have your completed paper and a different-colour pen ready. Choose the statement that matches what you originally wrote. Correct working can earn marks even when the answer is wrong.</p></div><div class="mini-step"><span class="step-num">2</span><h3>Mark your paper</h3><p>Follow the instruction beside each question. Circle the printed mark bracket for full marks. Otherwise, cross the bracket once and write the marks you earned next to it.</p></div><div class="mini-step"><span class="step-num">3</span><h3>Record and share</h3><p>At the end, write the total on the front of your paper. Copy the ready-made message and send it to your tutor in Teams. Start the Century targets in the order shown.</p></div></div><div class="notice"><strong>Keep your original answers unchanged while marking.</strong> Do corrections afterwards, in another colour. If a marking choice does not fit your work, choose “I need my tutor to check this”.</div>';
    if (!(storedAvailable && state.started)) {
      html += '<form id="start-form"><div class="form-grid"><label class="field">Your full name <span aria-hidden="true">*</span><input id="student-name" name="studentName" autocomplete="name" maxlength="100" required value="' + e(state.student.name) + '"></label><label class="field">Tutor’s name <small>(optional)</small><input id="student-tutor" name="tutor" maxlength="100" value="' + e(state.student.tutor) + '"></label><label class="field">Class / group <small>(optional)</small><input id="student-group" name="group" maxlength="100" value="' + e(state.student.group) + '"></label><label class="field">Student number <small>(optional)</small><input id="student-number" name="studentNumber" maxlength="100" value="' + e(state.student.number) + '"></label></div><label class="checkline"><input id="original-check" type="checkbox" required><span>I have finished the exam. I will award marks for my <strong>original answers and working</strong>.</span></label><div class="buttons"><button class="primary" type="submit"' + (damagedSave || conflict ? ' disabled' : '') + '>Start marking</button><button type="button" class="subtle" data-action="import">Restore a progress backup</button></div></form>';
    }
    html += '<p class="source-note">Automatic saving uses this browser on this device. Reopen the same HTML file in the same location, or the same web address, to resume. Private browsing, clearing browser data, changing devices or moving the file may remove access to a save. A downloaded progress backup can be restored.</p></section>';
    html += footer();
    byId('main').innerHTML = html;
  }

  function footer() { return '<footer class="footer">Built for the supplied GCSE Mathematics Assessment 1 · 2026/27<br><button type="button" class="subtle" data-action="teacher">Tutor notes and marking sources</button></footer>'; }

  function renderQuestion() {
    const s = steps[state.current], a = selectedResponse(s), r = engine.scoreStep(s, a), sum = engine.summary(state);
    let html = '<div class="screen-meta"><span><strong>' + e(state.student.name) + '</strong> · Marking step ' + (state.current + 1) + ' of ' + steps.length + '</span><span>' + sum.recorded + ' steps recorded · <button type="button" class="inline-link" data-action="overview">Go to a question</button></span></div>';
    html += '<div class="question-layout"><section class="question-main"><div class="card"><div class="question-heading"><div><div class="eyebrow">Find page ' + s.page + ' of your paper</div><h1>Question ' + e(s.ref) + '</h1></div><span class="pill">' + s.max + ' ' + markWord(s.max) + '</span></div><div class="question-prompt">' + s.promptHtml + '</div><div class="answer-box"><h2>Answer to compare with your paper</h2><div class="answer-content">' + s.answerHtml + (s.diagramHtml || '') + '</div></div>';
    if (s.guidanceHtml) html += '<div class="guidance">' + s.guidanceHtml + '</div>';
    html += '<h2>What did you originally write?</h2><p class="small-text muted">Select one statement in each group. Choose the highest-mark statement that is true for your original work.</p>';
    if (r.override) html += '<div class="notice warning"><strong>Tutor mark: ' + r.score + '/' + s.max + '.</strong><br>' + e(a.override.reason) + '<br><button type="button" class="inline-link" data-action="clear-override">Remove this tutor adjustment</button> to use the choices again.</div>';
    for (const g of s.groups) {
      html += '<fieldset class="choices"' + (r.override || conflict ? ' disabled' : '') + '><legend>' + e(g.label) + '</legend>';
      for (const o of g.options) html += choiceHTML(s, g, o.id, o.label, o.detail || '', o.score + ' ' + markWord(o.score), a.choices && a.choices[g.id] === o.id, false);
      html += choiceHTML(s, g, REVIEW, 'I need my tutor to check this.', 'My working is unusual, I am unsure, or more than one statement seems to fit. This stays pending until checked.', 'Tutor check', a.choices && a.choices[g.id] === REVIEW, true);
      html += '</fieldset>';
    }
    html += '<p class="source-note">Marking source: supplied mark scheme, page ' + s.schemePage + '. Equivalent correct methods and the listed partial-credit rules are included. <button type="button" class="inline-link" data-action="tutor-adjust">Checking with your tutor?</button></p></div></section><aside class="paper-rail" aria-label="What to write on your paper"><div id="paper-panel" class="card" aria-live="polite" aria-atomic="true"></div><div class="card flat"><div class="rail-label">Remember</div><p class="small-text">Use a different-colour pen. Mark the printed <strong>[number]</strong> at the end of this part. Leave your original working visible.</p><p class="small-text muted">Only use the answers you wrote during the exam when choosing your marks.</p></div></aside></div><nav class="question-nav" aria-label="Question navigation"><button type="button" data-action="previous"' + (state.current === 0 ? ' disabled' : '') + '>← Previous</button><button type="button" class="subtle" data-action="save-menu">Pause / save</button><button type="button" id="next-button" class="primary" data-action="next"></button></nav>' + footer();
    byId('main').innerHTML = html;
    updateQuestionPanel();
  }

  function choiceHTML(s, g, id, label, detail, mark, selected, review) {
    return '<label class="choice' + (selected ? ' selected' : '') + (review ? ' review' : '') + '"><input type="radio" name="' + e(s.id + '_' + g.id) + '" value="' + e(id) + '" data-question="' + e(s.id) + '" data-group="' + e(g.id) + '"' + (selected ? ' checked' : '') + '><span class="choice-content"><span class="choice-title">' + e(label) + '</span><span class="choice-detail">' + e(detail) + '</span></span><span class="choice-mark">' + e(mark) + '</span></label>';
  }

  function standardPaperInstruction(score, max, label) {
    const prefix = label ? '<strong>' + e(label) + ':</strong> ' : '';
    if (score === max) return '<p>' + prefix + 'Circle the printed <strong>[' + max + ']</strong>. You earned all ' + max + ' ' + markWord(max) + '.</p><div class="mark-demo"><span class="mark-circle">[' + max + ']</span></div>';
    return '<p>' + prefix + 'Put one line or cross through the printed <strong>[' + max + ']</strong>. Write <strong>' + score + '/' + max + '</strong> next to it.</p><div class="mark-demo"><span class="mark-cross">[' + max + ']</span><span class="mark-written">' + score + '/' + max + '</span></div>';
  }

  function paperInstructions(s, r) {
    if (!r.decided) return '<p>Select your marking choices first. The app will then show exactly what to write here.</p>';
    if (r.review) return '<p>Write <strong>“? — tutor check”</strong> beside the printed mark bracket for Question ' + e(s.ref) + '.</p><p>Leave the bracket visible until your tutor resolves the mark. The total will be labelled provisional.</p>';
    if (s.special === 'sharedProbability') {
      if (r.shared) return '<p>Put a line through <strong>both printed [1] brackets</strong> for 7(a) and 7(b). Draw a bracket linking these two parts and write:</p><div class="mark-demo"><span class="mark-written">1/2 shared mark</span></div><p>This is <strong>one mark across the pair</strong>. Add only 1 to Question 7.</p>';
      if (r.override) return '<p>Use the tutor’s agreed total across 7(a) and 7(b). Link the two printed mark brackets and write <strong>' + r.score + '/2 — tutor checked</strong>.</p><p>Count these marks once in Question 7.</p>';
      return r.groups.map(g => standardPaperInstruction(g.score, g.max, g.id === 'a' ? '7(a)' : '7(b)')).join('');
    }
    return standardPaperInstruction(r.score, s.max);
  }

  function updateQuestionPanel() {
    const s = steps[state.current], a = selectedResponse(s), r = engine.scoreStep(s, a);
    let html = '<div class="rail-label">Now write on your paper</div>';
    if (r.decided) html += '<div class="score-large">' + (r.review ? '?' : r.score) + '<span> / ' + s.max + '</span></div><p class="step-status">' + (r.review ? 'Tutor check needed' : r.paperDone ? 'Mark recorded on your paper' : r.score === s.max ? 'Full marks for this part' : r.score === 0 ? 'No marks for this part' : 'Partial credit awarded') + '</p>';
    else html += '<h2 style="margin-top:.7rem">Your mark will appear here.</h2>';
    html += '<div class="paper-instruction">' + paperInstructions(s, r) + '</div>';
    if (r.decided) html += '<hr><p class="small-text"><strong>Once you have written this on your paper,</strong> use the next button below.</p>';
    byId('paper-panel').innerHTML = html;
    const next = byId('next-button');
    next.disabled = !r.decided || conflict;
    next.textContent = r.review ? 'I’ve written ? — ' + (state.current === steps.length - 1 ? 'see total' : 'next →') : 'Paper marked — ' + (state.current === steps.length - 1 ? 'see total' : 'next →');
  }

  function choose(questionId, groupId, optionId) {
    if (conflict) { notify('Load the latest saved progress before making more changes.'); render(false); return; }
    const s = stepById[questionId], g = s && s.groups.find(g => g.id === groupId);
    if (!g || (optionId !== REVIEW && !g.options.some(o => o.id === optionId))) return;
    if (!state.answers[questionId]) state.answers[questionId] = {choices: {}, paperDone: false};
    const a = state.answers[questionId];
    a.choices[groupId] = optionId; a.paperDone = false; delete a.override;
    invalidateCompletion(); save();
    document.querySelectorAll('input[data-question="' + questionId + '"][data-group="' + groupId + '"]').forEach(input => input.closest('.choice').classList.toggle('selected', input.checked));
    updateQuestionPanel();
  }

  function navigate(index) {
    closeModal(); state.current = Math.max(0, Math.min(steps.length - 1, index)); state.view = 'mark'; save(); render(true);
  }

  function nextQuestion() {
    const s = steps[state.current], r = engine.scoreStep(s, selectedResponse(s));
    if (!r.decided || conflict) return;
    state.answers[s.id].paperDone = true; save();
    if (state.current < steps.length - 1) navigate(state.current + 1);
    else finish();
  }

  function finish() {
    const sum = engine.summary(state);
    if (!sum.ready) {
      openOverview(true);
      return;
    }
    closeModal(); state.view = 'summary'; save(); render(true);
  }

  function renderSummary() {
    const sum = engine.summary(state), list = engine.targets(state), pending = !sum.confirmed;
    let html = '<section class="card summary-heading"><div><div class="eyebrow">End term assessment · October 2026</div><h1>' + (pending ? 'Your provisional results' : 'Your marking is complete') + '</h1><p class="muted">' + e(state.student.name) + ', finish the paper checklist below, then send your results and targets to your tutor.</p><div class="pills"><span class="pill">' + sum.recorded + ' marking steps recorded</span>' + (pending ? '<span class="pill">' + sum.review.length + ' steps need a tutor check</span>' : '<span class="pill">' + e(engine.grade(sum.score)) + ' assessment band</span>') + '</div></div><div class="summary-score"><div class="rail-label">' + (pending ? 'Provisional total' : 'Total marks') + '</div><div class="score-large">' + (pending ? sum.score + '–' + sum.upper : sum.score) + '<span> / ' + sum.max + '</span></div><p class="small-text">' + (pending ? 'Resolve the ? marks with your tutor.' : Math.round(sum.score / sum.max * 100) + '% · using this paper’s grade table') + '</p></div></section>';
    if (pending) html += '<div class="notice warning"><strong>Some marks still need checking.</strong> Your confirmed credit is ' + sum.score + ' marks; the final total could be up to ' + sum.upper + '. The unresolved steps are excluded from the targets for now. Update them with your tutor, then copy the revised report.</div>';
    html += '<div class="summary-grid"><section class="card"><div class="completion-step"><span class="step-num">1</span><div><h2>Write your total on the front</h2><p>Copy the question totals into the <strong>Mark Awarded</strong> column on the front of your exam paper. At the bottom of that table, write <strong>' + (pending ? '“Provisional ' + sum.score + '–' + sum.upper + '/50 — tutor check”' : sum.score + '/50') + '</strong>.</p></div></div><div class="table-wrap"><table><caption class="sr-only">Marks to copy onto the front of the exam paper</caption><thead><tr><th>Question</th><th class="num">Write this mark</th><th class="num">Out of</th></tr></thead><tbody>';
