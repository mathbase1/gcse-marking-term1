    for (const p of sum.parents) html += '<tr' + (p.pending ? ' class="row-needs"' : '') + '><td>Q' + p.q + '</td><td class="num"><strong>' + (p.pending ? p.score + '–' + p.upper + ' ?' : p.score) + '</strong></td><td class="num">' + p.max + '</td></tr>';
    html += '<tr><th>Total</th><td class="num"><strong>' + (pending ? sum.score + '–' + sum.upper + ' ?' : sum.score) + '</strong></td><td class="num"><strong>50</strong></td></tr></tbody></table></div><label class="checkline"><input type="checkbox" data-final="front"' + (state.finalChecks.front ? ' checked' : '') + '><span>I have copied the question totals and the ' + (pending ? 'provisional' : 'final') + ' total onto the front of my paper.</span></label><div class="buttons no-print"><button type="button" class="small" data-action="overview">Review / change a mark</button><button type="button" class="small" data-action="edit-student">Edit my details</button></div></section>';
    const targetHeading = list.length ? 'Write your first targets' : pending ? 'Resolve the tutor checks' : 'Choose your next challenge';
    const targetInstruction = list.length ? 'On the back of your paper, in a spare space, write <strong>“My Century targets”</strong>. Copy the first ' + (list.length === 1 ? 'target' : 'two targets') + ' below. Complete them before moving to the rest of the list.' : pending ? 'Ask your tutor to resolve the pending marks. Your targets will update once these checks are complete.' : 'You have earned all 50 marks. Ask your tutor for an extension task to work on next.';
    html += '<section class="card"><div class="completion-step"><span class="step-num">2</span><div><h2>' + targetHeading + '</h2><p>' + targetInstruction + '</p></div></div>';
    if (list.length) html += '<ol>' + list.slice(0, 2).map(t => '<li><strong class="target-code">' + e(t.code) + '</strong> — ' + e(t.name) + '</li>').join('') + '</ol><label class="checkline"><input type="checkbox" data-final="targets"' + (state.finalChecks.targets ? ' checked' : '') + '><span>I have written my first targets on my paper.</span></label>';
    else html += '<div class="notice">' + (pending ? 'No targets from the confirmed marks yet. Resolve the tutor checks, then look here again.' : '<strong>All marks achieved.</strong> You do not need catch-up nuggets from this assessment. Ask your tutor for an extension task.') + '</div>';
    html += '<div class="notice"><strong>How to find a nugget</strong><br>Open CENTURY through your usual school login. In GCSE Maths Foundation, search the exact <strong>MF code</strong>. Complete the nugget, then redo the linked question in a different colour on your paper. Keep the original assessment mark.<br><br>If a code is unavailable, ask your tutor to find or assign it.</div>';
    if (sum.review.length) html += '<h3>Ask your tutor to check</h3><div class="buttons">' + sum.review.map(r => '<button type="button" class="small" data-action="goto" data-index="' + steps.findIndex(s => s.id === r.id) + '">Question ' + e(stepById[r.id].ref) + '</button>').join('') + '</div>';
    html += '</section></div>';
    html += '<section class="card"><h2>Your Century practice plan</h2><p class="muted">Zero-mark questions and parts come first. Partly correct work comes second. A repeated nugget appears once and keeps all linked questions. Within each priority, the nuggets linked to more lost marks appear first.</p>';
    if (!list.length) html += '<p>' + (pending ? 'Targets will update once the pending marks are checked.' : 'No catch-up targets needed from this assessment.') + '</p>';
    if (list.length > 4) html += '<details class="target-plan"><summary>Show all ' + list.length + ' targets in priority order</summary>';
    for (const priority of [1, 2]) {
      const items = list.filter(t => t.priority === priority);
      if (!items.length) continue;
      html += '<div class="target-group"><div class="target-title"><span class="priority-tag' + (priority === 2 ? ' second' : '') + '">' + priority + '</span><h3 style="margin:0">' + (priority === 1 ? 'First: questions / parts with zero marks' : 'Next: questions / parts with some marks lost') + '</h3></div><ol class="target-list">';
      for (const t of items) html += targetHTML(t, list.indexOf(t));
      html += '</ol></div>';
    }
    if (list.length > 4) html += '</details>';
    html += '<p class="source-note">Names and codes come from the supplied Century nugget list. Some are supporting practice for a more specific assessment skill; follow the “Practise” instruction as well as the nugget.</p></section>';
    html += '<section class="card"><div class="completion-step"><span class="step-num">3</span><div><h2>Copy this message and send it in Teams</h2><p>Press <strong>Copy Teams message</strong>. Open Teams, open the chat with your tutor, paste the text and press <strong>Send</strong>. The app prepares the message for you; you send it yourself.</p></div></div><label class="field" for="teams-report">Your ready-to-copy message</label><textarea id="teams-report" class="teams-box" readonly spellcheck="false">' + e(engine.makeReport(state)) + '</textarea><div class="buttons no-print"><button type="button" class="primary" data-action="copy-report">Copy Teams message</button><button type="button" data-action="download-report">Download message (.txt)</button><button type="button" data-action="print">Print results</button></div><label class="checkline"><input type="checkbox" data-final="sent"' + (state.finalChecks.sent ? ' checked' : '') + '><span>I have pasted this message into Teams and sent it to my tutor.</span></label><div id="completion-message">' + completionMessage(list) + '</div></section><div class="buttons no-print"><button type="button" data-action="backup">Download progress backup</button><button type="button" class="subtle" data-action="reset">Start again / different student</button></div>' + footer();
    byId('main').innerHTML = html;
  }

  function targetHTML(t, index) {
    return '<li class="target-item' + (index < 2 ? ' start-here' : '') + '">' + (index < 2 ? '<span class="start-label">Target ' + (index + 1) + ' · start here</span>' : '') + '<div><span class="target-code">' + e(t.code) + '</span> <span class="target-name">' + e(t.name) + '</span></div><div class="target-refs">From ' + t.refs.map(r => 'Q' + e(r.ref) + ' (' + r.score + '/' + r.max + ')').join(' · ') + '</div>' + t.reasons.map(reason => '<p><strong>Practise:</strong> ' + e(reason) + '</p>').join('') + (t.supporting ? '<div class="target-note">Closest supporting nugget in the supplied list. Also practise the specific question skill above.</div>' : '') + '</li>';
  }

  function completionMessage(list) {
    const done = state.finalChecks.front && (state.finalChecks.targets || list.length === 0) && state.finalChecks.sent;
    return done ? '<div class="notice"><strong>Your paper and message are recorded.</strong> ' + (list.length ? 'Start with your first Century target.' : 'Ask your tutor about your next task.') + '</div>' : '<p class="small-text muted">Tick the checklist only after you have completed each action. Your progress stays saved.</p>';
  }

  function updateReport() {
    if (!byId('teams-report')) return;
    byId('teams-report').value = engine.makeReport(state);
    byId('print-text').textContent = engine.makeReport(state);
    byId('completion-message').innerHTML = completionMessage(engine.targets(state));
  }

  function openModal(title, body, kind) {
    modalReturnFocus = document.activeElement;
    currentModal = kind || '';
    byId('modal-root').innerHTML = '<div class="dialog-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><div class="dialog-header"><h2 id="dialog-title">' + e(title) + '</h2><button type="button" class="dialog-close subtle" aria-label="Close dialog" data-action="close-modal">×</button></div>' + body + '</section></div>';
    document.body.style.overflow = 'hidden';
    const first = byId('modal-root').querySelector('input:not([type=hidden]),select,textarea,button:not(.dialog-close)') || byId('modal-root').querySelector('.dialog-close');
    first.focus();
  }

  function closeModal() {
    if (!byId('modal-root').firstChild) return;
    byId('modal-root').innerHTML = ''; document.body.style.overflow = ''; currentModal = '';
    if (modalReturnFocus && modalReturnFocus.isConnected) modalReturnFocus.focus({preventScroll:true});
  }

  function openOverview(finishing) {
    const sum = engine.summary(state);
    let body = '<p>Choose a question to review it. <strong>Pending</strong> means no final mark has been agreed; it does not mean zero marks.</p>';
    if (finishing) body += '<div class="notice warning">Before you finish, complete ' + sum.missing.length + ' unmarked ' + (sum.missing.length === 1 ? 'step' : 'steps') + ' and record ' + sum.notWritten.length + ' outstanding paper ' + (sum.notWritten.length === 1 ? 'mark' : 'marks') + '. Open each outstanding step, follow its paper instruction, then use “Paper marked — next”.</div>';
    body += '<div class="overview-grid">';
    steps.forEach((s, i) => {
      const r = engine.scoreStep(s, state.answers[s.id]);
      const status = r.missing ? 'Not marked' : r.review ? 'Tutor check' : !r.paperDone ? r.score + '/' + s.max + ' · write on paper' : r.score + '/' + s.max + ' · recorded';
      body += '<button type="button" class="overview-item' + (r.paperDone && r.confirmed ? ' done' : r.review || (r.decided && !r.paperDone) ? ' needs' : '') + (i === state.current ? ' current' : '') + '" data-action="goto" data-index="' + i + '">Q' + e(s.ref) + '<span>' + e(status) + '</span></button>';
    });
    body += '</div><div class="buttons"><button type="button" class="primary" data-action="finish"' + (!sum.ready ? ' disabled' : '') + '>Open total and targets</button><button type="button" data-action="close-modal">Continue marking</button></div>';
    openModal('Your questions', body, 'overview');
  }

  function openHelp() {
    openModal('How to mark your paper', '<ol><li><strong>Finish your exam on paper first.</strong> Use your original answers and working when marking.</li><li><strong>Find the question and page shown.</strong> Compare your work with the displayed answer. Select the highest statement that accurately describes your work. Some screens have more than one marking group.</li><li><strong>Record the mark on paper.</strong> For full marks, circle the printed [number]. For fewer marks, put a line or cross through that printed bracket and write the marks awarded, such as 1/3 or 0/3. Keep your work visible.</li><li><strong>Press “Paper marked — next”.</strong> This confirms you followed the paper instruction. Use Previous or Questions to review. Changing an answer means you must update the paper mark too.</li><li><strong>If unsure, choose tutor check.</strong> Write “? — tutor check” by that part and carry on. It will remain provisional until resolved.</li><li><strong>At the end, fill in the front-page table and total.</strong> Write the first two Century targets on the back of your paper.</li><li><strong>Copy the final message and send it to your tutor in Teams.</strong> Then do your Century nuggets in order and correct the linked paper questions in a different colour.</li></ol><div class="hero-visual" style="transform:none;max-width:420px">' + markingExamples() + '</div><p class="small-text muted">Q7(a) and Q7(b) appear together because their mark scheme has a shared special-case mark. Follow the specific paper instruction when it appears.</p>', 'help');
  }

  function openDisplay() {
    openModal('Display settings', '<p>Choose the page colour and text size that are easiest to read.</p><div class="form-grid"><label class="field">Page colour<select id="theme-setting">' + [['light','Light'],['dark','Dark'],['blue','Pale blue'],['yellow','Pale yellow']].map(([v,n]) => '<option value="' + v + '"' + (state.settings.theme === v ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label></div><label class="checkline"><input type="checkbox" id="large-setting"' + (state.settings.large ? ' checked' : '') + '><span>Larger text</span></label><p class="small-text muted">You can also use your browser’s zoom controls. Keyboard users can use Tab and the arrow keys to move through the marking choices.</p><button type="button" class="primary" data-action="close-modal">Done</button>', 'display');
  }

  function openSaveMenu() {
    const sum = engine.summary(state);
    openModal('Save, pause and resume', '<div class="notice' + (saveError ? ' warning' : '') + '"><strong>' + (saveError ? 'Download a backup before closing.' : 'Progress saves after every choice.') + '</strong><br>' + (state.started ? e(state.student.name) + ' · ' + sum.recorded + '/' + steps.length + ' steps recorded.' : 'Start a marking session to save your responses.') + '</div><p>To resume, reopen the <strong>same file in the same location and browser on this device</strong>, or the same web address. Your answers will be waiting on the welcome screen.</p><p>For another device or a moved file, download a progress backup now, then restore it there. Keep that backup private because it includes your name and marks.</p><div class="buttons"><button type="button" class="primary" data-action="backup">Download progress backup</button><button type="button" data-action="import">Restore a backup</button></div>' + (damagedSave ? '<div class="notice warning">The existing saved data is unreadable. <button type="button" class="inline-link" data-action="damaged-backup">Download that saved data</button> before resetting.</div>' : '') + '<hr><div class="buttons"><button type="button" class="subtle danger" data-action="reset">Start again / different student</button><button type="button" data-action="close-modal">Return to my work</button></div><p class="small-text muted">The app stores work in this browser. Marks are shared with your tutor when you paste and send the final message in Teams.</p>', 'save');
  }

  function download(text, filename, type) {
    const blob = new Blob([text], {type: type || 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function safeFilename(name) { return (name || 'student').replace(/[^a-zA-Z0-9_-]+/g, '_').slice(0, 60); }
  function backup() { download(JSON.stringify(state, null, 2), 'October_2026_' + safeFilename(state.student.name) + '_progress.json', 'application/json'); notify('Progress backup prepared. Check your browser’s Downloads folder.'); }

  function openImport() {
    delete global.__pendingAssessmentImport;
    openModal('Restore a progress backup', '<p>Choose a progress <strong>.json</strong> file downloaded from this app. Restoring replaces the current session in this browser after you confirm the student’s name.</p><div class="buttons"><button type="button" data-action="backup">Back up this session first</button></div><label class="field" style="margin-top:1rem">Progress file<input type="file" id="import-file" accept=".json,application/json"></label><div id="import-status" role="status"></div>', 'import');
  }

  async function importFile(file) {
    if (!file) return;
    if (file.size > 250000) { byId('import-status').innerHTML = '<div class="notice error">That file is too large to be a progress backup from this app.</div>'; return; }
    try {
      const next = engine.validateState(JSON.parse(await file.text()));
      global.__pendingAssessmentImport = next;
      const sum = engine.summary(next);
      byId('import-status').innerHTML = '<div class="notice"><strong>' + e(next.student.name || 'Session not started') + '</strong><br>' + sum.recorded + ' marking steps recorded.<br>Saved: ' + e(new Date(next.updatedAt).toLocaleString('en-GB')) + '</div><div class="buttons"><button type="button" class="primary" data-action="confirm-import">Restore this student’s progress</button><button type="button" data-action="close-modal">Cancel</button></div>';
    } catch (err) { byId('import-status').innerHTML = '<div class="notice error">Could not restore that file: ' + e(err.message) + '</div>'; }
  }

  function openReset() {
    openModal('Start a new marking session?', '<p>This removes the saved responses for <strong>' + e(state.student.name || 'this session') + '</strong> from this browser. Download a progress backup first if you need to keep them.</p><div class="buttons"><button type="button" data-action="backup">Download backup first</button><button type="button" class="danger" data-action="confirm-reset">Clear responses and start again</button><button type="button" class="primary" data-action="close-modal">Keep my work</button></div>', 'reset');
  }

  function openStudentEdit() {
    openModal('Edit your details', '<form id="student-edit-form"><div class="form-grid">' + [['name','Your full name'],['tutor','Tutor’s name'],['group','Class / group'],['number','Student number']].map(([k,label]) => '<label class="field">' + label + '<input name="' + k + '" maxlength="100" value="' + e(state.student[k]) + '"' + (k === 'name' ? ' required' : '') + '></label>').join('') + '</div><button type="submit" class="primary">Save details</button></form>', 'student');
  }

  function openTutorAdjustment() {
    const s = steps[state.current], a = selectedResponse(s), r = engine.scoreStep(s, a);
    openModal('Check Question ' + s.ref + ' with your tutor', '<p>Use this when your tutor has looked at your <strong>original paper</strong> and agreed a mark. It records their decision and reason in the final Teams message.</p><form id="tutor-form"><label class="field">Tutor’s agreed mark, out of ' + s.max + '<select id="override-score" required><option value="">Choose the agreed mark</option>' + Array.from({length:s.max+1}, (_,n) => '<option value="' + n + '"' + (a.override && a.override.score === n ? ' selected' : '') + '>' + n + '/' + s.max + '</option>').join('') + '</select></label><label class="field" style="margin-top:1rem">Tutor’s reason<textarea id="override-reason" maxlength="600" minlength="3" required rows="3" placeholder="For example: equivalent valid method checked on paper">' + e(a.override ? a.override.reason : '') + '</textarea></label><label class="checkline"><input type="checkbox" required><span>My tutor has checked this work and agreed this mark.</span></label><button type="submit" class="primary">Use tutor’s mark</button></form><p class="small-text muted">This is a recorded review, with no password or staff authentication. Original choices are retained. A tutor-adjusted partial mark uses the question’s topic targets because the exact lost subskill may differ.</p>', 'tutor');
  }

  function openTeacherNotes() {
    const body = '<p>This is a guided self-marking tool for an exam completed on paper. Students choose evidence statements; it does not read or authenticate their paper. Any unusual, contradictory or uncertain work can be left for tutor review.</p><details open><summary>Source files and total</summary><ul><li>' + e(data.sources.paper) + ' — question order, diagrams and printed marks.</li><li>' + e(data.sources.scheme) + ' — answers, partial credit, follow-through, special cases and assessment bands.</li><li>' + e(data.sources.catalog) + ' — exact Century MF codes and nugget titles.</li></ul><p>The 14 question maxima are 1, 4, 2, 1, 1, 7, 6, 2, 4, 5, 3, 3, 6 and 5. Total: 50. There are 30 printed parts and 29 marking screens because 7(a) and 7(b) share a special-case rule.</p></details><details><summary>Marking rules that need special care</summary><ul><li>Q6(a): the bread-roll and birthday-cake prices jointly earn one mark. Correct addition of the student’s own prices can earn the total mark, except for place-value errors.</li><li>Q7(a–b): the stated consistent incorrect “out of” notation earns one shared mark only when neither normal mark is awarded. It is never counted twice or assigned arbitrarily to one part.</li><li>Q9: use the listed scale-drawing special cases and unit rules. The scheme’s broad “digits 75” wording is interpreted as that digit sequence; unclear answers go to tutor review.</li><li>Q10(c): reflex angles from 298° to 302° inclusive earn the mark.</li><li>Q11: correct incomplete method and trial evidence can earn one or two marks; full marks require 11 whole days as the answer.</li><li>Q13(c): valid follow-through, embedded answers, contradictions and the listed special case are handled without stacking extra marks.</li><li>Q13(a–b): the abbreviated wording about “sight of” and final answers can be ambiguous when later work contradicts an earlier result. The choices direct those cases to tutor review.</li><li>Correct final answers normally imply a valid method where appropriate; explicit contradictory working should be checked by the tutor.</li></ul></details><details><summary>Target priority and matching</summary><p>Zero-mark completed printed parts have priority 1. Partially credited parts have priority 2. For Q8, Q10(a), Q6(a) and other grouped evidence, the mark for the printed part determines priority while only the deficient subskill triggers a nugget. Q7(a) and 7(b) are separate priority units normally; the shared special-case mark is a combined 1/2 priority-2 result.</p><p>Codes are deduplicated; any linked zero-mark part raises a code to priority 1. Within a priority, sort by the sum of lost marks on distinct linked parts, then question order. This is a practice order, not a claim that a nugget recovers a fixed number of marks. All relevant targets remain available.</p><p>Nuggets were matched using the supplied titles. Supporting matches are labelled. Live Century lesson contents and links are not embedded. The app produces targets for students to find or for tutors to assign in the school’s Century account.</p></details><details><summary>Assessment bands from the supplied scheme</summary><table><thead><tr><th>Marks</th><th>Band</th></tr></thead><tbody>' + data.bands.map((b,i) => '<tr><td>' + b.min + '–' + (i === 0 ? 50 : data.bands[i-1].min - 1) + '</td><td>' + e(b.label) + '</td></tr>').join('') + '</tbody></table><p>These bands are the assessment’s supplied table. Pending tutor checks do not produce a final band.</p></details><details><summary>Saving, sharing and a shared computer</summary><p>All responses are kept in this browser’s local storage. Use the same URL or same file path to resume, and offer the JSON backup for another device. A different student should choose “Start again / different student”. Students manually paste the report into Teams; this app does not connect to Teams or Century.</p><p>Download and retain the single HTML file for distribution. It includes all marking data, diagrams and code, and needs no external scripts or fonts. Saving depends on the browser permitting local storage. A visible warning and backup option are shown if saving fails.</p></details>';
    openModal('Tutor notes and marking sources', body, 'teacher');
  }

  async function copyReport() {
    const report = byId('teams-report');
    if (!report) return;
    let copied = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(report.value); copied = true; } } catch (_) {}
    if (!copied) {
      report.focus(); report.select(); report.setSelectionRange(0, report.value.length);
      try { copied = document.execCommand('copy'); } catch (_) {}
    }
    notify(copied ? 'Message copied. Open your tutor’s Teams chat, paste it and press Send.' : 'The text is selected. Press Ctrl+C (or Command+C), then paste it into your tutor’s Teams chat.');
  }

  document.addEventListener('submit', event => {
    if (event.target.id === 'start-form') {
      event.preventDefault();
      if (damagedSave || conflict || !event.target.reportValidity()) return;
      const name = byId('student-name').value.trim();
      if (!name) { byId('student-name').setCustomValidity('Enter your name.'); byId('student-name').reportValidity(); return; }
      state.student = {name, tutor:byId('student-tutor').value.trim(), group:byId('student-group').value.trim(), number:byId('student-number').value.trim()};
      state.started = true; state.view = 'mark'; state.current = 0; save(); render(true);
    } else if (event.target.id === 'student-edit-form') {
      event.preventDefault();
      if (!event.target.reportValidity()) return;
      const vals = new FormData(event.target);
      if (!String(vals.get('name')).trim()) return;
      ['name','tutor','group','number'].forEach(k => state.student[k] = String(vals.get(k) || '').trim().slice(0,100));
      state.finalChecks.sent = false; save(); closeModal(); render(false); notify('Details updated. Copy and send the updated message if you shared an earlier one.');
    } else if (event.target.id === 'tutor-form') {
      event.preventDefault();
      if (!event.target.reportValidity()) return;
      const s = steps[state.current], score = Number(byId('override-score').value), reason = byId('override-reason').value.trim();
      if (!Number.isInteger(score) || score < 0 || score > s.max || reason.length < 3) return;
      if (!state.answers[s.id]) state.answers[s.id] = {choices:{},paperDone:false};
      state.answers[s.id].override = {score,reason}; state.answers[s.id].paperDone = false; invalidateCompletion();
      save(); closeModal(); render(false); notify('Tutor mark recorded. Now update the mark on your paper.');
    }
  });

  document.addEventListener('input', event => {
    const t = event.target;
    if (['student-name','student-tutor','student-group','student-number'].includes(t.id) && !state.started) {
      const key = {'student-name':'name','student-tutor':'tutor','student-group':'group','student-number':'number'}[t.id];
      state.student[key] = t.value.slice(0,100); t.setCustomValidity(''); save();
    }
  });

  document.addEventListener('change', event => {
    const t = event.target;
    if (t.matches('input[data-question]')) choose(t.dataset.question, t.dataset.group, t.value);
    else if (t.dataset.final) {
      state.finalChecks[t.dataset.final] = t.checked;
      if (t.dataset.final !== 'sent') state.finalChecks.sent = false;
      save(); updateReport();
      const sent = document.querySelector('input[data-final="sent"]'); if (sent) sent.checked = state.finalChecks.sent;
    } else if (t.id === 'theme-setting') { state.settings.theme = t.value; applyDisplay(); save(); }
    else if (t.id === 'large-setting') { state.settings.large = t.checked; applyDisplay(); save(); }
    else if (t.id === 'import-file') importFile(t.files[0]);
  });

  document.addEventListener('click', event => {
    const b = event.target.closest('[data-action]');
    if (!b || b.disabled) return;
    const action = b.dataset.action;
    if (action === 'help') openHelp();
    else if (action === 'display') openDisplay();
    else if (action === 'save-menu') openSaveMenu();
    else if (action === 'overview') openOverview(false);
    else if (action === 'next') nextQuestion();
    else if (action === 'previous') navigate(state.current - 1);
    else if (action === 'goto') navigate(Number(b.dataset.index));
    else if (action === 'finish') finish();
    else if (action === 'resume') { state.view = engine.summary(state).ready ? 'summary' : 'mark'; save(); render(true); }
    else if (action === 'close-modal') closeModal();
    else if (action === 'backup') backup();
    else if (action === 'import') openImport();
    else if (action === 'confirm-import') {
      if (!global.__pendingAssessmentImport) return;
      state = global.__pendingAssessmentImport; delete global.__pendingAssessmentImport;
      damagedSave = null; conflict = false; state.view = state.started ? engine.summary(state).ready ? 'summary' : 'mark' : 'welcome';
      save(true); closeModal(); render(true); notify('Progress restored for ' + (state.student.name || 'this session') + '.');
    } else if (action === 'reset') openReset();
    else if (action === 'confirm-reset') {
      state = engine.freshState(state.settings); storedAvailable = false; damagedSave = null; conflict = false;
      save(true); closeModal(); render(true);
    } else if (action === 'copy-report') copyReport();
    else if (action === 'download-report') download(engine.makeReport(state), 'October_2026_' + safeFilename(state.student.name) + '_results_and_targets.txt');
    else if (action === 'print') { updateReport(); window.print(); }
    else if (action === 'edit-student') openStudentEdit();
    else if (action === 'tutor-adjust') openTutorAdjustment();
    else if (action === 'clear-override') {
      const s = steps[state.current]; delete state.answers[s.id].override; state.answers[s.id].paperDone = false;
      invalidateCompletion(); save(); render(false);
    } else if (action === 'teacher') openTeacherNotes();
    else if (action === 'damaged-backup') download(damagedSave || '', 'October_2026_unreadable_progress.txt');
    else if (action === 'reload-save') {
      try {
        const raw = localStorage.getItem(STORAGE_KEY); if (!raw) throw new Error('No saved progress was found.');
        state = engine.validateState(JSON.parse(raw)); lastSeenRaw = raw; conflict = false; saveError = ''; damagedSave = null; storedAvailable = state.started;
        state.view = 'welcome'; closeModal(); render(true);
      } catch (err) { notify('Could not load saved progress: ' + err.message); }
    }
  });

  document.addEventListener('keydown', event => {
    if (!byId('modal-root').firstChild) return;
    if (event.key === 'Escape') { event.preventDefault(); closeModal(); return; }
    if (event.key !== 'Tab') return;
    const elements = [...byId('modal-root').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],summary')].filter(el => el.getClientRects().length);
    if (!elements.length) return;
    const first = elements[0], last = elements[elements.length-1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });

  window.addEventListener('storage', event => {
    if (event.key !== STORAGE_KEY || event.newValue === lastSeenRaw) return;
    conflict = true; updateSaveStatus();
    if (state.view === 'mark') render(false);
  });
  // Every choice, identity input, display setting and navigation change is saved
  // synchronously in its own handler. Do not write stale state during tab closing.

  loadSaved();
  state.view = 'welcome';
  render(false);
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
</html>
